<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<title>小柠檬内核 · 控制面板</title>
<style>
:root{--bg:#070B14;--card:rgba(20,26,40,.72);--card2:rgba(27,34,51,.85);--line:rgba(255,255,255,.07);--txt:#EDF0F7;--dim:#8B92A9;--dim2:#5A6178;--lemon:#FFC53D;--blue:#4C78FF;--blue2:#7B9BFF;--green:#00D084;--red:#FF5A5F;--purple:#A78BFA;--cyan:#22D3EE;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{width:100%;color:var(--txt);font-family:system-ui,-apple-system,'PingFang SC','Segoe UI',sans-serif;line-height:1.55;padding:0 14px 60px;max-width:980px;margin:0 auto;background:var(--bg);position:relative}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 480px at 85% -8%,rgba(255,197,61,.10),transparent 60%),radial-gradient(800px 500px at -12% 12%,rgba(76,120,255,.14),transparent 58%),radial-gradient(700px 460px at 50% 108%,rgba(0,208,132,.09),transparent 60%),var(--bg)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:14px 2px;margin:0 -2px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(7,11,20,.9),rgba(7,11,20,.55) 80%,transparent)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--lemon),#FF9F43);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 18px rgba(255,197,61,.35)}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.brand .sub{display:block;color:var(--dim);font-size:11px;font-weight:400}
.hright{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{width:36px;height:36px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:15px;transition:.2s;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{color:var(--lemon);border-color:rgba(255,197,61,.4);transform:rotate(90deg)}
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;backdrop-filter:blur(12px);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.hero::after{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,61,.16),transparent 70%);pointer-events:none}
.hero .lab{color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.hero .big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px;background:linear-gradient(100deg,#fff 20%,var(--lemon));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .big small{font-size:22px;-webkit-text-fill-color:var(--green)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;transition:.2s}
.pill b{color:var(--txt);font-weight:700}
.pill.ok{border-color:rgba(0,208,132,.35)}.pill.ok b{color:var(--green)}
.pill.bad{border-color:rgba(255,90,95,.35)}.pill.bad b{color:var(--red)}
.pill.warn b{color:var(--lemon)}
.nav{position:relative;display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:5px;backdrop-filter:blur(12px)}
.nav .tab{flex:0 0 auto;text-align:center;padding:10px;border-radius:11px;color:var(--dim);cursor:pointer;font-size:14px;font-weight:600;transition:.25s;position:relative;z-index:1}
.nav .tab.on{color:#081018;background:linear-gradient(135deg,var(--lemon),#FFB020);box-shadow:0 6px 18px rgba(255,197,61,.3)}
.view{animation:viewin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.35)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{position:relative;flex:1}
.search input{padding-left:38px}
.search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
input,textarea,select{background:rgba(7,11,20,.6);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;font-size:13px;width:100%;transition:.2s;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--lemon);box-shadow:0 0 0 3px rgba(255,197,61,.14)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--dim);font-size:12px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dc,var(--dim))}
.chip.on{background:rgba(255,197,61,.14);border-color:rgba(255,197,61,.5);color:var(--lemon)}
.chip .n{opacity:.65;font-size:11px}
.tool{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:9px;cursor:pointer;transition:.22s;animation:tin .4s ease backwards;border-left:3px solid var(--dc,var(--line))}
.tool:hover{transform:translateY(-2px);border-color:rgba(255,197,61,.35);border-left-color:var(--dc);box-shadow:0 10px 26px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tool .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool .nm{font-weight:700;font-size:14px}
.tool .ds{color:var(--dim);font-size:12px;margin-top:6px}
.tag{font-size:10.5px;padding:2px 8px;border-radius:7px;border:1px solid var(--line);color:var(--dim)}
.tag.dom{color:var(--dc);border-color:var(--dc);opacity:.9}
.star{margin-left:auto;cursor:pointer;color:var(--dim2);font-size:15px;line-height:1}.star.on{color:var(--lemon)}
.risk{font-size:10.5px;padding:2px 9px;border-radius:7px;font-weight:700}
.risk.low{color:var(--green);background:rgba(0,208,132,.13)}
.risk.medium{color:var(--lemon);background:rgba(255,197,61,.13)}
.risk.high{color:var(--red);background:rgba(255,90,95,.13)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.gauge{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:15px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.gauge .k{color:var(--dim);font-size:11px;letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase}
.ring{position:relative;width:86px;height:86px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
.gauge .hint{color:var(--dim2);font-size:11px;margin-top:9px}
.spark{width:100%;height:44px;margin-top:6px}
.svcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.svc{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;transition:.2s}
.svc:hover{border-color:rgba(255,255,255,.16)}
.svc .nm{display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.up{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite}
.dot.down{background:var(--red);box-shadow:0 0 8px var(--red)}
.svc .port{color:var(--dim2);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:10px 7px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
tr{transition:.15s}tbody tr:hover{background:rgba(255,255,255,.03)}
.dec{font-size:10.5px;padding:3px 9px;border-radius:7px;font-weight:700}
.dec.ALLOW{color:var(--green);background:rgba(0,208,132,.13)}
.dec.CONFIRM_REQUIRED,.dec.PATH_PROTECTED{color:var(--red);background:rgba(255,90,95,.13)}
.modal{position:fixed;inset:0;background:rgba(4,7,13,.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.show{display:flex}
.modal .box{background:#121826;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px 28px;width:100%;max-width:620px;max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 50px rgba(0,0,0,.5)}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:24px}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mhead b{font-size:16px}
.x{background:var(--card2);border:1px solid var(--line);color:var(--dim);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:14px;transition:.2s}
.x:hover{color:var(--red);border-color:rgba(255,90,95,.4)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.fld .req{color:var(--red)}
.fld .hint{font-size:11px;color:var(--dim2);margin-top:4px}
.switch{display:flex;gap:10px;align-items:center;background:rgba(255,90,95,.07);border:1px solid rgba(255,90,95,.25);border-radius:13px;padding:12px 14px;margin:14px 0;font-size:13px;cursor:pointer}
.switch input{width:auto;accent-color:var(--red)}
.btn-call{width:100%;background:linear-gradient(135deg,var(--green),#00B876);color:#04120C;font-weight:800;border:none;border-radius:14px;padding:14px;font-size:14px;cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(0,208,132,.25)}
.btn-call:hover{filter:brightness(1.1);transform:translateY(-1px)}
pre{background:rgba(7,11,20,.7);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:11px;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-all;margin-top:10px}
.sect{color:var(--dim);font-size:12px;margin:15px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sect .act{color:var(--blue2);cursor:pointer;font-size:12px}
.empty{text-align:center;color:var(--dim2);padding:46px 0;font-size:13px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1B2233;border:1px solid var(--line);color:var(--txt);padding:12px 20px;border-radius:14px;font-size:13px;opacity:0;transition:.3s;z-index:99;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:fixed;right:18px;bottom:24px;width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:16px;z-index:45;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(10px)}
.fab.show{opacity:1;pointer-events:auto}
.fab:hover{color:var(--lemon);border-color:rgba(255,197,61,.4)}
.skel{background:linear-gradient(90deg,var(--card2) 25%,rgba(255,255,255,.06) 50%,var(--card2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:15px;height:64px;margin-bottom:9px}
@keyframes sh{to{background-position:-200% 0}}
.banner{background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.4);color:var(--red);border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:12px}
</style></head><body>
<div id="alertbar" class="banner" style="display:none"></div>
<div class="topbar">
<div class="brand"><span class="logo">🍋</span><div><h1>小柠檬内核</h1><span class="sub">控制面板 · v5</span></div></div>
<div class="hright"><span class="live"><i></i><span class="mono" id="clock"></span></span><button class="iconbtn" onclick="refreshAll()" title="刷新">⟳</button></div>
</div>
<div class="hero">
<div class="lab">全链路工具总数</div>
<div class="big"><span id="total">0</span><small>↑</small></div>
<div class="pills" id="pills"></div>
</div>
<div class="nav">
<div class="tab on" data-t="tools">工具列表</div>
<div class="tab" data-t="mon">监控面板</div>
<div class="tab" data-t="audit">调用审计</div>
<div class="tab" data-t="search">知识搜索</div>
<div class="tab" data-t="sys">系统</div>
<div class="tab" data-t="logs">日志</div>
</div>
<div id="page-tools" class="view">
<div class="row"><div class="search"><input id="q" placeholder="搜索工具名 / 描述…" oninput="renderTools()"></div></div>
<div class="chips" id="domchips"></div>
<div class="chips" id="recents"></div>
<div class="row">
<select id="frisk" onchange="renderTools()" style="width:auto;flex:0 0 auto"><option value="">全部风险</option><option value="low">只读 low</option><option value="medium">medium</option><option value="high">high</option></select>
<span class="pill" id="tcount" style="flex:0 0 auto"></span>
</div>
<div id="tools"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>
<div id="page-mon" class="view" style="display:none">
<div class="grid2" id="sys"></div>
<div class="card" style="margin-top:12px"><div class="sect"><span>链路服务</span><span id="svccount" class="mono"></span></div><div class="svcgrid" id="svcs"></div></div>
</div>
<div id="page-audit" class="view" style="display:none">
<div class="row"><select id="fdec" onchange="renderAudit()" style="width:auto;flex:0 0 auto"><option value="">全部决策</option><option value="ALLOW">ALLOW</option><option value="CONFIRM_REQUIRED">CONFIRM_REQUIRED</option><option value="PATH_PROTECTED">PATH_PROTECTED</option></select><input id="ftool" placeholder="过滤工具名…" oninput="renderAudit()" style="flex:1"><button class="iconbtn" onclick="copyAudit()" title="复制JSON">⧉</button></div>
<div class="pills" id="astats" style="margin-bottom:12px"></div>
<div class="card"><table><thead><tr><th>时间</th><th>工具</th><th>风险</th><th>决策</th></tr></thead><tbody id="arows"></tbody></table></div>
</div>
<div id="page-search" class="view" style="display:none">
<div class="row"><div class="search"><input id="kbq" placeholder="语义搜索 工具/记忆/学习中心…" onkeydown="if(event.key==='Enter')doSearch()"></div><button class="iconbtn" onclick="doSearch()">⌕</button></div>
<div class="chips" id="kbkind"><span class="chip on" onclick="setKind('')">全部</span><span class="chip" onclick="setKind('tool')">工具</span><span class="chip" onclick="setKind('memory')">记忆</span><span class="chip" onclick="setKind('learn')">学习</span></div>
<div id="kbres"><div class="empty">输入关键词回车搜索</div></div>
</div>
<div id="page-sys" class="view" style="display:none"><div class="grid2" id="sysinfo"></div></div>
<div id="page-logs" class="view" style="display:none">
<div class="chips" id="logsrc"><span class="chip on" onclick="setLog('panel')">面板</span><span class="chip" onclick="setLog('boot')">启动</span><span class="chip" onclick="setLog('kernel')">内核</span><span class="chip" onclick="setLog('audit')">审计</span></div>
<pre id="logpre" class="mono" style="max-height:60vh">—</pre>
</div>
<div class="modal" id="modal"><div class="box">
<div class="mhead"><b id="mname" class="mono"></b><span style="display:flex;gap:8px"><button class="x" id="mstar" onclick="toggleFav(CUR.name)">☆</button><button class="x" onclick="closeM()">✕</button></span></div>
<div id="mdesc" style="color:var(--dim);font-size:12px;margin-bottom:14px"></div>
<div id="mform"></div>
<div class="sect"><span>高级</span><span class="act" onclick="toggleJson()">JSON 模式</span></div>
<textarea id="margs" rows="4" style="display:none" class="mono">{}</textarea>
<label class="switch"><input type="checkbox" id="mconfirm"><span>确认执行（破坏性操作必须勾选，经确认门 + 审计）</span></label>
<button class="btn-call" onclick="callTool()">调用工具</button>
<div class="sect"><span>结果</span><span class="act" onclick="copyRes()">复制</span></div>
<pre id="mres" class="mono">—</pre>
</div></div>
<button class="fab" id="fab" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="toast" id="toast"></div>
<script>
let TOOLS=[],CUR=null,DOM='',JSONMODE=false,LOADHIST=[],LASTTOTAL=0,AUDROWS=[];
let FAV=[],REC=[];
try{FAV=JSON.parse(localStorage.getItem('lp_fav')||'[]')}catch(e){}
try{REC=JSON.parse(localStorage.getItem('lp_recent')||'[]')}catch(e){}
function saveFav(){localStorage.setItem('lp_fav',JSON.stringify(FAV))}
function toggleFav(n,ev){if(ev)ev.stopPropagation();const i=FAV.indexOf(n);if(i>=0)FAV.splice(i,1);else FAV.unshift(n);saveFav();buildChips();renderTools();renderStar()}
function pushRec(n){REC=REC.filter(r=>r.name!==n);REC.unshift({name:n,ts:Date.now()});REC=REC.slice(0,8);localStorage.setItem('lp_recent',JSON.stringify(REC));renderRec()}
function renderRec(){const el=$('recents');if(!el)return;el.innerHTML=REC.length?('<span class="chip" style="cursor:default;color:var(--dim2)">最近调用</span>'+REC.map(r=>'<span class="chip" onclick="openM(\''+esc(r.name)+'\')">'+esc(r.name)+'</span>').join('')):'';}
function renderStar(){const b=$('mstar');if(b&&CUR){const on=FAV.includes(CUR.name);b.textContent=on?'★':'☆';b.style.color=on?'var(--lemon)':'var(--dim)'}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DC=['#4C78FF','#00D084','#FFC53D','#A78BFA','#22D3EE','#FF5A5F','#F472B6','#34D399','#FB923C','#818CF8'];
function dcolor(d){let h=0;for(const c of String(d))h=(h*31+c.charCodeAt(0))>>>0;return DC[h%DC.length]}
async function j(u,o){const c=new AbortController();const t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(u,Object.assign({},o,{signal:c.signal}));return await r.json()}finally{clearTimeout(t)}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function clock(){$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false})}
setInterval(clock,1000);clock();
addEventListener('scroll',()=>{$('fab').classList.toggle('show',scrollY>400)});
function countUp(el,to){const from=LASTTOTAL;LASTTOTAL=to;const t0=performance.now();const dur=700;
function step(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
async function overview(){try{const d=await j('/api/overview');countUp($('total'),d.total);
$('pills').innerHTML='<span class="pill">本地<b>'+d.local+'</b></span><span class="pill">上游Java<b>'+d.upstream+'</b></span><span class="pill">MT镜像<b>'+d.mt+'</b></span><span class="pill '+(d.safe?'ok':'bad')+'">safe门面<b>'+(d.safe?'在线':'离线')+'</b></span><span class="pill '+(d.core?'ok':'bad')+'">8788<b>'+(d.core?'在线':'离线')+'</b></span><span class="pill warn">运行<b>'+d.uptime+'</b></span>';}catch(e){}}
async function loadTools(){try{const d=await j('/api/tools');TOOLS=d.tools||[];buildChips();renderTools();renderRec()}catch(e){$('tools').innerHTML='<div class="empty">工具加载失败 <span style="color:var(--blue2);cursor:pointer" onclick="loadTools()">重试</span></div>'}}
function buildChips(){const cnt={};TOOLS.forEach(t=>{const dm=t.domain||'其他';cnt[dm]=(cnt[dm]||0)+1});
$('domchips').innerHTML='<span class="chip '+(DOM==='__fav'?'on':'')+'" onclick="setDom(\'__fav\')">★ 收藏<span class="n">'+FAV.length+'</span></span><span class="chip '+(DOM===''?'on':'')+'" onclick="setDom(\'\')">全部<span class="n">'+TOOLS.length+'</span></span>'+Object.keys(cnt).sort().map(dm=>'<span class="chip '+(DOM===dm?'on':'')+'" style="--dc:'+dcolor(dm)+'" onclick="setDom(\''+esc(dm)+'\')"><i></i>'+esc(dm)+'<span class="n">'+cnt[dm]+'</span></span>').join('');}
function setDom(d){DOM=d;buildChips();renderTools()}
function renderTools(){const q=$('q').value.toLowerCase(),fr=$('frisk').value;
const list=TOOLS.filter(t=>(!q||t.name.toLowerCase().includes(q)||(t.desc||'').toLowerCase().includes(q))&&(!fr||t.risk===fr)&&(DOM==='__fav'?FAV.includes(t.name):(!DOM||(t.domain||'其他')===DOM)));
$('tcount').innerHTML='共<b>'+list.length+'</b>项';
$('tools').innerHTML=list.slice(0,400).map((t,i)=>'<div class="tool" style="--dc:'+dcolor(t.domain||'其他')+';animation-delay:'+Math.min(i*22,400)+'ms" onclick="openM(\''+esc(t.name)+'\')"><div class="top"><span class="nm mono">'+esc(t.name)+'</span><span class="star '+(FAV.includes(t.name)?'on':'')+'" onclick="toggleFav(\''+esc(t.name)+'\',event)">'+(FAV.includes(t.name)?'★':'☆')+'</span><span class="risk '+t.risk+'">'+t.risk+(t.ro?' · 只读':'')+'</span>'+(t.domain?'<span class="tag dom">'+esc(t.domain)+'</span>':'')+(t.tid?'<span class="tag mono">'+esc(t.tid)+'</span>':'')+'</div><div class="ds">'+esc(t.desc||'')+'</div></div>').join('')||'<div class="empty">无匹配工具</div>';}
function openM(n){CUR=TOOLS.find(t=>t.name===n);if(!CUR)return;$('mname').textContent=n;$('mdesc').textContent=CUR.desc||'';
JSONMODE=false;$('margs').style.display='none';$('mform').style.display='block';buildForm();$('mconfirm').checked=!CUR.ro;$('mres').textContent='—';renderStar();$('modal').classList.add('show');}
function buildForm(){const sch=CUR.schema||{};const props=sch.properties||{};const req=sch.required||[];const keys=Object.keys(props);
if(!keys.length){$('mform').innerHTML='<div class="fld"><label>无参数（可用 JSON 模式手动填）</label></div>';return}
$('mform').innerHTML=keys.map(k=>{const p=props[k]||{};const rq=req.includes(k);const lab='<label>'+esc(k)+(rq?' <span class="req">*</span>':'')+'</label>';const hint=p.description?'<div class="hint">'+esc(p.description)+'</div>':'';
if(p.type==='boolean')return '<div class="fld">'+lab+'<label style="display:flex;gap:8px;align-items:center;color:var(--txt)"><input type="checkbox" data-k="'+esc(k)+'" data-t="boolean" style="width:auto;accent-color:var(--green)"> 启用</label>'+hint+'</div>';
if(p.enum)return '<div class="fld">'+lab+'<select data-k="'+esc(k)+'" data-t="string">'+p.enum.map(e=>'<option value="'+esc(e)+'">'+esc(e)+'</option>').join('')+'</select>'+hint+'</div>';
const it=(p.type==='integer'||p.type==='number')?'number':'text';
return '<div class="fld">'+lab+'<input type="'+it+'" data-k="'+esc(k)+'" data-t="'+(p.type||'string')+'" placeholder="'+esc(p.type||'string')+'">'+hint+'</div>';}).join('');}
function toggleJson(){JSONMODE=!JSONMODE;const ta=$('margs');
if(JSONMODE){ta.value=JSON.stringify(collectForm(),null,1);ta.style.display='block';$('mform').style.display='none'}
else{ta.style.display='none';$('mform').style.display='block'}}
function collectForm(){const a={};document.querySelectorAll('#mform [data-k]').forEach(el=>{const k=el.dataset.k,t=el.dataset.t;
if(t==='boolean'){if(el.checked)a[k]=true}else if(el.value!==''){a[k]=(t==='integer'||t==='number')?Number(el.value):el.value}});return a}
function closeM(){$('modal').classList.remove('show')}
function copyRes(){const t=$('mres').textContent;if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('已复制'))}else{toast('复制不可用')}}
async function callTool(){let args;
if(JSONMODE){try{args=JSON.parse($('margs').value||'{}')}catch(e){$('mres').textContent='参数 JSON 错误: '+e;return}}
else args=collectForm();
$('mres').textContent='调用中…';
try{const d=await j('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:CUR.name,arguments:args,confirm:$('mconfirm').checked})});
let txt=JSON.stringify(d,null,1);try{const c=d.content&&d.content[0]&&d.content[0].text;if(c){txt=JSON.stringify(JSON.parse(c.replace(/^\[exit=\d+\]\s*/,'')),null,1)}}catch(e){}
$('mres').textContent=txt.slice(0,8000);pushRec(CUR.name);toast('调用完成');}catch(e){$('mres').textContent='请求失败: '+e}}
function ring(pct,col,label){const r=36,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,pct))/100);
return '<div class="ring"><svg width="86" height="86"><circle cx="43" cy="43" r="'+r+'" stroke="rgba(255,255,255,.07)" stroke-width="8" fill="none"/><circle cx="43" cy="43" r="'+r+'" stroke="'+col+'" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .8s"/></svg><div class="val" style="color:'+col+'">'+label+'</div></div>'}
function spark(){if(LOADHIST.length<2)return '<div class="hint">采集负载中…</div>';
const w=200,h=44,max=Math.max(...LOADHIST,1);const pts=LOADHIST.map((v,i)=>(i*(w/(LOADHIST.length-1)))+','+(h-4-(v/max)*(h-10))).join(' ');
return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linejoin="round"/><polyline points="0,'+h+' '+pts+' '+w+','+h+'" fill="rgba(34,211,238,.12)" stroke="none"/></svg>'}
async function mon(){const d=await j('/api/status');const s=d.system||{};
const memPct=s.mem_total_gb?Math.round((1-s.mem_avail_gb/s.mem_total_gb)*100):0;
const bat=s.battery!=null?s.battery:0;const batCol=bat>50?'var(--green)':bat>20?'var(--lemon)':'var(--red)';
if(s.load&&s.load[0]!=null){LOADHIST.push(parseFloat(s.load[0]));if(LOADHIST.length>30)LOADHIST.shift()}
$('sys').innerHTML='<div class="gauge"><div class="k">内存占用</div>'+ring(memPct,'var(--blue)',memPct+'%')+'<div class="hint">'+(s.mem_avail_gb||'-')+' / '+(s.mem_total_gb||'-')+' GB</div></div>'
+'<div class="gauge"><div class="k">电池</div>'+ring(bat,batCol,bat+'%')+'<div class="hint">温度 '+(s.battery_temp!=null?s.battery_temp:'-')+'°C</div></div>'
+'<div class="gauge" style="grid-column:1/-1"><div class="k">系统负载 1m · 趋势</div><div class="mono" style="font-size:16px;font-weight:700">'+(s.load||[]).join(' · ')+'</div>'+spark()+'</div>';
let sv=d.services||[];try{const pr=await j('/api/probe');if(pr.services)sv=pr.services}catch(e){}
const up=sv.filter(v=>v.up).length;$('svccount').textContent=up+' / '+sv.length+' 在线';
$('svcs').innerHTML=sv.map(v=>'<div class="svc"><span class="nm"><span class="dot '+(v.up?'up':'down')+'"></span>'+esc(v.name)+'</span><span class="ms mono">'+(v.ms!=null?v.ms+'ms':'—')+'</span><span class="port mono">:'+v.port+'</span></div>').join('');}
async function audit(){const d=await j('/api/audit');
$('astats').innerHTML=Object.keys(d.stats||{}).map(k=>'<span class="pill '+(k==='ALLOW'?'ok':'bad')+'">'+k+'<b>'+d.stats[k]+'</b></span>').join('')+'<span class="pill">近期<b>'+d.total+'</b></span>';
AUDROWS=d.rows||[];renderAudit();}
function renderAudit(){const fd=$('fdec')?$('fdec').value:'',ft=($('ftool')?$('ftool').value:'').toLowerCase();
const rows=AUDROWS.filter(r=>(!fd||r.decision===fd)&&(!ft||String(r.target||r.entry||'').toLowerCase().includes(ft)));
$('arows').innerHTML=rows.map(r=>'<tr><td class="mono">'+String(r.ts||'').slice(11)+'</td><td class="mono">'+esc(r.target||r.entry||'')+'</td><td>'+(r.risk||'')+'</td><td><span class="dec '+(r.decision||'')+'">'+(r.decision||'')+'</span></td></tr>').join('')||'<tr><td colspan="4" style="color:var(--dim2);text-align:center;padding:24px">暂无审计记录</td></tr>';}
function copyAudit(){const t=JSON.stringify(AUDROWS,null,1);if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('审计JSON已复制'))}else{toast('复制不可用')}}
document.querySelectorAll('.nav .tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.nav .tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
['tools','mon','audit','search','sys','logs'].forEach(p=>{const el=$('page-'+p);el.style.display=(p===t.dataset.t?'':'none');if(p===t.dataset.t){el.classList.remove('view');void el.offsetWidth;el.classList.add('view')}});
if(t.dataset.t==='mon')mon();if(t.dataset.t==='audit')audit();if(t.dataset.t==='sys')loadSys();if(t.dataset.t==='logs')loadLogs();});
let KBKIND='',LOGSRC_CUR='panel';
function setKind(k){KBKIND=k;document.querySelectorAll('#kbkind .chip').forEach(c=>c.classList.remove('on'));if(window.event&&window.event.target)window.event.target.classList.add('on');doSearch()}
async function doSearch(){const q=$('kbq').value.trim();if(!q){$('kbres').innerHTML='<div class="empty">输入关键词回车搜索</div>';return}
$('kbres').innerHTML='<div class="skel"></div>';
try{const d=await j('/api/search?q='+encodeURIComponent(q)+(KBKIND?'&kind='+KBKIND:''));const rs=(d.data&&d.data.results)||[];
$('kbres').innerHTML=rs.map(r=>'<div class="tool" style="--dc:'+dcolor(r.kind)+'"><div class="top"><span class="nm mono">'+esc(r.key)+'</span><span class="tag dom">'+esc(r.kind)+'</span></div><div class="ds">'+esc(r.title)+'</div></div>').join('')||'<div class="empty">无结果</div>';}catch(e){$('kbres').innerHTML='<div class="empty">搜索失败</div>'}}
async function loadSys(){const d=await j('/api/sysinfo');const up=d.uptime_s||0;const dd=Math.floor(up/86400),hh=Math.floor(up%86400/3600),mm=Math.floor(up%3600/60);
$('sysinfo').innerHTML=[['设备型号',d.model],['Android',d.android+' (SDK '+d.sdk+')'],['内核',d.kernel],['CPU 核心',d.cpu_cores],['开机时长',dd+'天'+hh+'时'+mm+'分'],['存储',d.storage_free_gb+' / '+d.storage_total_gb+' GB 可用']].map(kv=>'<div class="gauge"><div class="k">'+kv[0]+'</div><div class="mono" style="font-size:15px;font-weight:700">'+esc(kv[1])+'</div></div>').join('');}
function setLog(sr){LOGSRC_CUR=sr;document.querySelectorAll('#logsrc .chip').forEach(c=>c.classList.remove('on'));if(window.event&&window.event.target)window.event.target.classList.add('on');loadLogs()}
async function loadLogs(){const d=await j('/api/logs?src='+LOGSRC_CUR+'&lines=120');$('logpre').textContent=(d.lines||[]).join('\n')||'(空)';}
async function checkAlert(){try{const d=await j('/api/probe');const down=(d.services||[]).filter(v=>!v.up);const b=$('alertbar');if(down.length){b.style.display='block';b.textContent='⚠ '+down.length+' 个服务离线: '+down.map(v=>v.name).join(', ');}else{b.style.display='none'}}catch(e){}}
async function refreshAll(){overview();loadTools();mon();audit();checkAlert()}
refreshAll();setInterval(()=>{overview();if($('page-mon').style.display!=='none')mon();if($('page-audit').style.display!=='none')audit();checkAlert();},8000);
$('modal').onclick=e=>{if(e.target===$('modal'))closeM()};
</script></body></html>
